<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学题库工作台</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --qb-bg: #f5f7fb;
            --qb-panel: #ffffff;
            --qb-border: #dfe5ee;
            --qb-text: #1f2933;
            --qb-muted: #667085;
            --qb-blue: #2563eb;
            --qb-green: #16a34a;
            --qb-orange: #f59e0b;
            --qb-red: #dc2626;
            --qb-purple: #7c3aed;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--qb-bg);
            color: var(--qb-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        .qb-shell {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 220px minmax(0, 1fr);
        }
        .qb-sidebar {
            background: #111827;
            color: #e5e7eb;
            padding: 18px 14px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }
        .qb-brand {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .qb-brand-sub {
            font-size: 12px;
            color: #9ca3af;
            line-height: 1.5;
            margin-bottom: 18px;
        }
        .qb-nav-group {
            margin-bottom: 18px;
        }
        .qb-nav-title {
            font-size: 11px;
            color: #9ca3af;
            margin: 12px 6px 6px;
        }
        .qb-nav-btn {
            width: 100%;
            border: 0;
            background: transparent;
            color: #d1d5db;
            padding: 9px 10px;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .qb-nav-btn:hover, .qb-nav-btn.active {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .qb-main {
            min-width: 0;
            padding: 18px;
        }
        .qb-topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 14px;
        }
        .qb-title h1 {
            margin: 0 0 4px;
            font-size: 24px;
        }
        .qb-title p {
            margin: 0;
            color: var(--qb-muted);
            font-size: 13px;
        }
        .qb-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .qb-btn {
            border: 1px solid var(--qb-border);
            background: #fff;
            color: var(--qb-text);
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 13px;
            line-height: 1;
        }
        .qb-btn.primary { background: var(--qb-blue); border-color: var(--qb-blue); color: #fff; }
        .qb-btn.success { background: var(--qb-green); border-color: var(--qb-green); color: #fff; }
        .qb-btn.danger { background: var(--qb-red); border-color: var(--qb-red); color: #fff; }
        .qb-btn.small { padding: 6px 8px; font-size: 12px; }
        .qb-btn:disabled { opacity: .5; cursor: not-allowed; }
        .qb-kpis {
            display: grid;
            grid-template-columns: repeat(6, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }
        .qb-kpi {
            background: var(--qb-panel);
            border: 1px solid var(--qb-border);
            border-radius: 10px;
            padding: 12px;
        }
        .qb-kpi-num {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 3px;
        }
        .qb-kpi-label {
            font-size: 12px;
            color: var(--qb-muted);
        }
        .qb-layout {
            display: grid;
            grid-template-columns: minmax(240px, 300px) minmax(0, 1fr) minmax(290px, 360px);
            gap: 12px;
            align-items: start;
        }
        .qb-panel {
            background: var(--qb-panel);
            border: 1px solid var(--qb-border);
            border-radius: 10px;
            min-width: 0;
        }
        .qb-panel-head {
            padding: 12px;
            border-bottom: 1px solid var(--qb-border);
            display: flex;
            justify-content: space-between;
            gap: 8px;
            align-items: center;
            font-weight: 700;
            font-size: 14px;
        }
        .qb-panel-body {
            padding: 12px;
        }
        .qb-filter-grid {
            display: grid;
            gap: 9px;
        }
        .qb-field label {
            display: block;
            font-size: 12px;
            color: var(--qb-muted);
            margin-bottom: 4px;
        }
        .qb-input, .qb-select, .qb-textarea {
            width: 100%;
            border: 1px solid var(--qb-border);
            border-radius: 8px;
            padding: 8px 9px;
            background: #fff;
            color: var(--qb-text);
            font-size: 13px;
        }
        .qb-textarea {
            min-height: 96px;
            resize: vertical;
            line-height: 1.5;
        }
        .qb-check-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
            font-size: 12px;
            color: var(--qb-muted);
        }
        .qb-list-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .qb-list-toolbar strong { font-size: 14px; }
        .qb-list {
            max-height: calc(100vh - 255px);
            overflow-y: auto;
            padding-right: 4px;
        }
        .qb-card {
            border: 1px solid var(--qb-border);
            border-radius: 10px;
            padding: 11px;
            margin-bottom: 10px;
            background: #fff;
        }
        .qb-card.selected {
            border-color: var(--qb-blue);
            box-shadow: 0 0 0 2px rgba(37,99,235,.12);
        }
        .qb-card-top {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .qb-card-title {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.45;
        }
        .qb-meta {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin: 6px 0;
        }
        .qb-badge {
            font-size: 11px;
            color: #344054;
            background: #f2f4f7;
            border: 1px solid #e4e7ec;
            border-radius: 999px;
            padding: 2px 7px;
        }
        .qb-badge.green { color: #166534; background: #dcfce7; border-color: #bbf7d0; }
        .qb-badge.orange { color: #92400e; background: #fef3c7; border-color: #fde68a; }
        .qb-badge.red { color: #991b1b; background: #fee2e2; border-color: #fecaca; }
        .qb-badge.blue { color: #1d4ed8; background: #dbeafe; border-color: #bfdbfe; }
        .qb-stem {
            white-space: pre-wrap;
            line-height: 1.55;
            font-size: 13px;
            color: #374151;
            margin: 8px 0;
        }
        .qb-formula {
            font-family: "SF Mono", Menlo, Consolas, monospace;
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            padding: 7px;
            font-size: 12px;
            overflow-x: auto;
            margin-top: 6px;
        }
        .qb-diagram {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            padding: 8px;
            margin-top: 6px;
            overflow-x: auto;
        }
        .qb-diagram svg { max-width: 100%; height: auto; }
        .qb-answer {
            color: #475467;
            font-size: 12px;
            margin-top: 8px;
        }
        .qb-basket-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }
        .qb-mini-stat {
            background: #f8fafc;
            border: 1px solid var(--qb-border);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
        }
        .qb-mini-stat strong {
            display: block;
            font-size: 18px;
        }
        .qb-mini-stat span {
            font-size: 11px;
            color: var(--qb-muted);
        }
        .qb-basket-list {
            max-height: 220px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        .qb-basket-item {
            border-bottom: 1px solid #edf2f7;
            padding: 8px 0;
            font-size: 12px;
        }
        .qb-output {
            min-height: 260px;
            max-height: 420px;
            overflow-y: auto;
            white-space: pre-wrap;
            background: #0f172a;
            color: #e5e7eb;
            border-radius: 10px;
            padding: 12px;
            line-height: 1.58;
            font-size: 13px;
        }
        .qb-empty {
            color: var(--qb-muted);
            text-align: center;
            padding: 28px 12px;
            font-size: 13px;
            line-height: 1.6;
        }
        .qb-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,.55);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }
        .qb-modal.show { display: flex; }
        .qb-modal-card {
            width: min(940px, 96vw);
            max-height: 92vh;
            overflow-y: auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(15,23,42,.25);
        }
        .qb-modal-head {
            padding: 14px 16px;
            border-bottom: 1px solid var(--qb-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800;
        }
        .qb-modal-body { padding: 16px; }
        .qb-form-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }
        .qb-form-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .qb-toast {
            position: fixed;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            background: #111827;
            color: #fff;
            padding: 10px 14px;
            border-radius: 999px;
            font-size: 13px;
            z-index: 3000;
            display: none;
        }
        .qb-toast.show { display: block; }
        @media (max-width: 1180px) {
            .qb-layout { grid-template-columns: 280px minmax(0, 1fr); }
            .qb-right { grid-column: 1 / -1; }
            .qb-kpis { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 820px) {
            .qb-shell { grid-template-columns: 1fr; }
            .qb-sidebar { position: static; height: auto; }
            .qb-layout { grid-template-columns: 1fr; }
            .qb-kpis { grid-template-columns: repeat(2, 1fr); }
            .qb-topbar { flex-direction: column; }
            .qb-actions { justify-content: flex-start; }
            .qb-form-grid, .qb-form-grid.two { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="qb-shell">
        <aside class="qb-sidebar">
            <div class="qb-brand">数学题库工作台</div>
            <div class="qb-brand-sub">独立题库系统 · 题目管理 · 组卷 · 讲义 · 举一反三</div>
            <div class="qb-nav-group">
                <div class="qb-nav-title">工作区</div>
                <button class="qb-nav-btn active" onclick="qbScrollTo('questionArea')">题目管理</button>
                <button class="qb-nav-btn" onclick="qbFocusIntake()">录题工作台</button>
                <button class="qb-nav-btn" onclick="qbScrollTo('basketArea')">题篮组卷</button>
                <button class="qb-nav-btn" onclick="qbScrollTo('outputArea')">输出生成</button>
            </div>
            <div class="qb-nav-group">
                <div class="qb-nav-title">常用筛选</div>
                <button class="qb-nav-btn" onclick="quickFilter({ grade: '六年级' })">六年级题库</button>
                <button class="qb-nav-btn" onclick="quickFilter({ grade: '初一' })">初一题库</button>
                <button class="qb-nav-btn" onclick="quickFilter({ chapter: '几何' })">几何专题</button>
                <button class="qb-nav-btn" onclick="quickFilter({ difficulty: '提高' })">提高题</button>
                <button class="qb-nav-btn" onclick="quickFilter({ hasDiagram: true })">含图形题</button>
            </div>
            <div class="qb-nav-group">
                <div class="qb-nav-title">系统入口</div>
                <button class="qb-nav-btn" onclick="location.href='/'">返回 AI 教培工作台</button>
                <button class="qb-nav-btn" onclick="window.open('/docs/STAGE_10_MATH_QUESTION_BANK_PRODUCT_DESIGN.md')">查看设计文档</button>
            </div>
        </aside>

        <main class="qb-main">
            <div class="qb-topbar">
                <div class="qb-title">
                    <h1>数学题库工作台</h1>
                    <p>把题库从“题目陈列”升级为“录题、筛题、题篮、组卷、讲义、变式”的完整流程。</p>
                </div>
                <div class="qb-actions">
                    <button class="qb-btn" onclick="location.href='/'">返回主系统</button>
                    <button class="qb-btn" onclick="openIntakeModal()">AI 辅助录入</button>
                    <button class="qb-btn primary" onclick="openQuestionEditor()">+ 新增题目</button>
                </div>
            </div>

            <section class="qb-kpis" id="qbKpis"></section>

            <section class="qb-layout">
                <aside class="qb-panel">
                    <div class="qb-panel-head">精准筛选 <button class="qb-btn small" onclick="resetFilters()">重置</button></div>
                    <div class="qb-panel-body qb-filter-grid">
                        <div class="qb-field">
                            <label>关键词</label>
                            <input class="qb-input" id="filterSearch" placeholder="题干/答案/知识点" oninput="applyFilters()">
                        </div>
                        <div class="qb-field">
                            <label>年级</label>
                            <select class="qb-select" id="filterGrade" onchange="applyFilters()"></select>
                        </div>
                        <div class="qb-field">
                            <label>章节</label>
                            <select class="qb-select" id="filterChapter" onchange="applyFilters()"></select>
                        </div>
                        <div class="qb-field">
                            <label>知识点</label>
                            <select class="qb-select" id="filterKnowledge" onchange="applyFilters()"></select>
                        </div>
                        <div class="qb-field">
                            <label>题型</label>
                            <select class="qb-select" id="filterType" onchange="applyFilters()"></select>
                        </div>
                        <div class="qb-field">
                            <label>难度</label>
                            <select class="qb-select" id="filterDifficulty" onchange="applyFilters()"></select>
                        </div>
                        <div class="qb-field">
                            <label>状态</label>
                            <select class="qb-select" id="filterStatus" onchange="applyFilters()">
                                <option value="">全部状态</option>
                                <option value="active">已启用</option>
                                <option value="draft">草稿</option>
                                <option value="archived">归档</option>
                            </select>
                        </div>
                        <div class="qb-field">
                            <label>特殊格式</label>
                            <div class="qb-check-row">
                                <label><input type="checkbox" id="filterFormula" onchange="applyFilters()"> 含公式</label>
                                <label><input type="checkbox" id="filterDiagram" onchange="applyFilters()"> 含图形</label>
                                <label><input type="checkbox" id="filterSolution" onchange="applyFilters()"> 有解析</label>
                                <label><input type="checkbox" id="filterMistake" onchange="applyFilters()"> 有易错点</label>
                            </div>
                        </div>
                        <button class="qb-btn primary" onclick="selectFilteredQuestions()">把筛选结果加入题篮</button>
                    </div>
                </aside>

                <section class="qb-panel" id="questionArea">
                    <div class="qb-panel-head">
                        <span>题目列表</span>
                        <span id="questionCountText">0 题</span>
                    </div>
                    <div class="qb-panel-body">
                        <div class="qb-list-toolbar">
                            <strong id="filterSummary">全部题目</strong>
                            <div>
                                <button class="qb-btn small" onclick="sortQuestions('updated')">最近更新</button>
                                <button class="qb-btn small" onclick="sortQuestions('difficulty')">按难度</button>
                            </div>
                        </div>
                        <div class="qb-list" id="questionList"></div>
                    </div>
                </section>

                <aside class="qb-panel qb-right" id="basketArea">
                    <div class="qb-panel-head">
                        <span>题篮组卷</span>
                        <button class="qb-btn small" onclick="clearBasket()">清空</button>
                    </div>
                    <div class="qb-panel-body">
                        <div class="qb-basket-summary" id="basketSummary"></div>
                        <div class="qb-basket-list" id="basketList"></div>
                        <div class="qb-field">
                            <label>输出标题</label>
                            <input class="qb-input" id="paperTitle" value="数学专题练习">
                        </div>
                        <div class="qb-form-grid two" style="margin-top:10px;">
                            <div class="qb-field">
                                <label>输出类型</label>
                                <select class="qb-select" id="outputType">
                                    <option value="paper">测试卷</option>
                                    <option value="handout">讲义</option>
                                    <option value="variants">举一反三</option>
                                    <option value="wrongbook">错题复练</option>
                                </select>
                            </div>
                            <div class="qb-field">
                                <label>答案解析</label>
                                <select class="qb-select" id="answerMode">
                                    <option value="teacher">教师版</option>
                                    <option value="student">学生版</option>
                                </select>
                            </div>
                        </div>
                        <div class="qb-actions" style="justify-content:flex-start;margin:10px 0;">
                            <button class="qb-btn primary" onclick="generateOutput()">生成</button>
                            <button class="qb-btn" onclick="copyOutput()">复制</button>
                            <button class="qb-btn" onclick="downloadOutput()">下载 MD</button>
                        </div>
                        <div class="qb-output" id="outputArea">先把题目加入题篮，再生成测试卷、讲义或举一反三练习。</div>
                    </div>
                </aside>
            </section>
        </main>
    </div>

    <div class="qb-modal" id="qbModal">
        <div class="qb-modal-card">
            <div class="qb-modal-head">
                <span id="qbModalTitle">新增题目</span>
                <button class="qb-btn small" onclick="closeQbModal()">关闭</button>
            </div>
            <div class="qb-modal-body" id="qbModalBody"></div>
        </div>
    </div>
    <div class="qb-toast" id="qbToast"></div>

    <script src="js/question-bank-system.js"></script>
</body>
</html>
