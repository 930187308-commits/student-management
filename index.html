<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 教培工作台</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="header">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1>AI 教培工作台</h1>
                <p id="headerStatus">Mac mini 本地服务器 · SQLite 数据库 · 多设备同步</p>
            </div>
            <div class="toolbar">
                <button class="theme-toggle" onclick="toggleDarkMode()" title="切换夜间模式">🌙</button>
                <button class="btn btn-secondary btn-sm" id="privacyToggleBtn" onclick="togglePrivacy()" title="隐藏/显示敏感数据" style="margin-right:8px;">👁</button>
                <span class="autosave-indicator" id="autosaveIndicator">● 已保存</span>
                <button class="btn btn-secondary btn-sm" onclick="undoLastChange()" id="undoBtn" title="撤回最近一次保存的修改" disabled>撤回上一步</button>
                <button class="btn btn-info btn-sm" onclick="showGistSetupModal()" id="gistSyncBtn" title="查看本地服务器同步说明">同步说明</button>
                <button class="btn btn-secondary btn-sm" onclick="unbindLicense()" title="解除授权">解绑</button>
                <button class="btn btn-secondary btn-sm" onclick="exportBackup()">导出备份</button>
                <div class="file-input-wrapper">
                    <button class="btn btn-warning btn-sm">导入备份</button>
                    <input type="file" accept=".json" onchange="importBackup(event)">
                </div>
                <button class="btn btn-info btn-sm health-check-button" onclick="openDataHealthCheck()">数据体检<span id="dataHealthBadge" class="health-badge" style="display:none;"></span></button>
                <button class="btn btn-primary btn-sm" onclick="openDataManager()">数据管理</button>
            </div>
        </div>
    </div>

    <div class="app-shell">
            <aside class="app-sidebar">
                <div class="sidebar-brand">
                    <h1>AI 教培工作台</h1>
                    <p>面向一个人运营的小型教培机构</p>
                </div>
                <nav class="nav-section">
                    <button class="tab nav-item active" data-tab="dashboard"><span class="dot"></span>首页</button>
                    <button class="tab nav-item" data-tab="reports"><span class="dot"></span>统计报表</button>
                </nav>
                <nav class="nav-section">
                    <button class="tab nav-item" data-tab="classes"><span class="dot"></span>班级管理</button>
                    <button class="tab nav-item" data-tab="attendance"><span class="dot"></span>考勤记录</button>
                    <button class="tab nav-item" data-tab="fees"><span class="dot"></span>收费记录</button>
                </nav>
                <nav class="nav-section">
                    <button class="tab nav-item" data-tab="students"><span class="dot"></span>学员管理</button>
                    <button class="tab nav-item" data-tab="grades"><span class="dot"></span>成绩记录</button>
                    <button class="tab nav-item" data-tab="communications"><span class="dot"></span>沟通记录</button>
                    <button class="tab nav-item" data-tab="prospects"><span class="dot"></span>意向学员</button>
                </nav>
                <nav class="nav-section">
                    <button class="tab nav-item" data-tab="ai-workspace"><span class="dot"></span>AI 工作台</button>
                    <button class="tab nav-item" data-tab="knowledge"><span class="dot"></span>知识库</button>
                </nav>
                <div class="sidebar-footer">
                    Mac mini 本地服务器<br>
                    SQLite 数据库 · 多设备同步
                </div>
            </aside>

            <main class="app-main">
                <!-- 统计卡片 -->
                <div class="stat-grid" id="statGrid"></div>

                <!-- 首页 -->
                <div class="tab-content active" id="tab-dashboard"></div>

                <!-- 班级管理 -->
                <div class="tab-content" id="tab-classes"></div>

                <!-- 学员管理 -->
                <div class="tab-content" id="tab-students"></div>

                <!-- 意向学员 -->
                <div class="tab-content" id="tab-prospects"></div>

                <!-- 收费记录 -->
                <div class="tab-content" id="tab-fees"></div>

                <!-- 考勤记录 -->
                <div class="tab-content" id="tab-attendance"></div>

                <!-- 成绩记录 -->
                <div class="tab-content" id="tab-grades"></div>

                <!-- 沟通记录 -->
                <div class="tab-content" id="tab-communications"></div>

                <!-- 统计报表 -->
                <div class="tab-content" id="tab-reports"></div>

                <!-- 知识库 -->
                <div class="tab-content" id="tab-knowledge"></div>

                <!-- AI 工作台 -->
                <div class="tab-content" id="tab-ai-workspace"></div>
            </main>
        </div>
    </div>

    <!-- 通用模态框 -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle"></h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- JS 模块 (按依赖顺序) -->
    <script src="js/data.js"></script>
    <script src="js/class.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/student.js"></script>
    <script src="js/fee.js"></script>
    <script src="js/attendance.js"></script>
    <script src="js/grade.js"></script>
    <script src="js/communication.js"></script>
    <script src="js/prospects.js"></script>
    <script src="js/statistics.js"></script>
    <script src="js/data-management.js"></script>
    <script src="js/ai-workspace.js"></script>
    <script src="js/knowledge.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
